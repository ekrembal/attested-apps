# Builds the store frontend on every push to `app-store` and publishes dist/ to the
# `app-store-pages` branch. Point GitHub Pages at that branch (root folder).
name: Build store for GitHub Pages

on:
  push:
    branches: [app-store]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Optional: set the repository variable STORE_API_URL to a store server
      # (with CORS_ORIGIN set to the Pages origin) to enable the Build section.
      - run: pnpm build
        env:
          VITE_API_URL: ${{ vars.STORE_API_URL }}

      - name: Publish dist/ to app-store-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b app-store-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" app-store-pages
